# Nginx interno del contenedor de la UI: sirve la SPA + los JSON del volumen compartido.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta del router de React -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Vite: cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Datos del worker (backtest/signals/portfolio/live). Montados desde el volumen
    # compartido en /usr/share/nginx/html/data. SIN cache: deben verse frescos.
    # Si el worker aun no los genero, devuelve 404 y la UI cae a su fallback mock.
    location /data/ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
